name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix shell --inputs-from . nixpkgs#jujutsu --command python3 scripts/ci.py prepare --checkout --artifact-dir "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate/
          retention-days: 14
  validate:
    needs: source
    uses: ./.github/workflows/validate.yml
    with:
      kind: checkout
  status:
    name: mesl-update/validated
    runs-on: ubuntu-24.04
    if: always()
    needs: validate
    steps:
      - env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
