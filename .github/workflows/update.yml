name: Update MESL
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
concurrency:
  group: mesl-autonomous-update
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      kind: ${{ steps.prepare.outputs.kind }}
      discoveryFailed: ${{ steps.prepare.outputs.discoveryFailed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JJ_USER: github-actions[bot]
          JJ_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: nix shell --inputs-from . nixpkgs#jujutsu nixpkgs#gh --command python3 scripts/ci.py prepare --artifact-dir "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate/
          retention-days: 14
  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      kind: ${{ needs.prepare.outputs.kind }}
  publish:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-evidence
          path: ${{ runner.temp }}/evidence
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: python3 scripts/ci.py restore --repo "$RUNNER_TEMP/publish" --artifact-dir "$RUNNER_TEMP/candidate"
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JJ_USER: github-actions[bot]
          JJ_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: nix shell --inputs-from . nixpkgs#jujutsu nixpkgs#gh --command python3 scripts/ci.py publish --repo "$RUNNER_TEMP/publish" --artifact-dir "$RUNNER_TEMP/candidate" --evidence-dir "$RUNNER_TEMP/evidence"
  discovery-status:
    needs: [prepare, validate, publish]
    if: always() && needs.prepare.outputs.discoveryFailed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '::error::MESL release discovery failed. See prepare logs. Heartbeat maintenance was evaluated independently.'
          exit 1
